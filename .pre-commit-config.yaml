# This is a new version to sync v11
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# repos:
# -   repo: https://github.com/pre-commit/pre-commit-hooks
#     rev: v3.2.0
#     hooks:
#     -   id: trailing-whitespace
#     -   id: end-of-file-fixer
#     -   id: check-yaml
#     -   id: check-added-large-files
repos:
  # Terraform: formatting, validation, and linting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        files: \.(tf|tofu|tfvars)$
        exclude: \.terraform/.*$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint

  # PowerShell linting (via PSScriptAnalyzer)
  - repo: local
    hooks:
      - id: powershell-lint
        name: PowerShell Lint
        entry: pwsh -Command "Invoke-ScriptAnalyzer -Path . -Recurse -EnableExit"
        language: system
        pass_filenames: false
        verbose: true
        files: \.ps1$

  # Bash: linting with ShellCheck
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
    -   id: shellcheck

  # Bash: formatting with shfmt
  - repo: https://github.com/pecigonzalo/pre-commit-shfmt
    rev: v2.2.0
    hooks:
    - id: shell-fmt
      args:
        - -i
        - "2"

  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.7.0
    hooks:
        - id: pre-commit-update
          args: []